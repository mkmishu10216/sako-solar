<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAKO Energy</title>
<style>
:root{--bg:#111315;--card:#1c1e21;--ink:#e3e5e8;--mute:#9aa0a8;--line:#2d3035;--pri:#03a9f4;--pv:#ffb300;--bat:#4caf50;--load:#03a9f4;--grid:#a678e8;--bad:#f44336}
[data-theme=light]{--bg:#f1f3f6;--card:#fff;--ink:#1d2024;--mute:#68707a;--line:#e1e4e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;font-weight:500;margin:0;flex:1}.pill{font-size:12px;background:#0003;padding:4px 10px;border-radius:99px}
header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;padding:14px;max-width:1180px;margin:auto}
.c{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px #0003}.c h3{margin:0 0 10px;font-size:16px;font-weight:500}
.wide{grid-column:span 2}@media(max-width:720px){.wide{grid-column:auto}}
.e{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.e:last-child{border:0}.e span{color:var(--mute)}.e i{font-style:normal;color:var(--mute)}
.gg{width:100%;max-width:260px;display:block;margin:auto}.small{font-size:12px;text-align:center;cursor:pointer}.mute{color:var(--mute)}
.flowsvg{width:100%;max-width:520px;display:block;margin:auto}.fl{stroke-dasharray:6 6}.fl.on{animation:dash .8s linear infinite}.fl.rev{animation-direction:reverse}@keyframes dash{to{stroke-dashoffset:-12}}
.chips{display:flex;gap:8px;margin-bottom:8px}.chip{border:1px solid var(--line);background:none;color:var(--ink);padding:5px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.mh{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--mute)}.mh b{color:var(--ink)}.mini{width:100%;display:block}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:3px}.bar i{display:block;height:100%;background:var(--bat);border-radius:3px}
input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;padding:12px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;font-weight:500;margin-top:6px;cursor:pointer}
</style></head><body>
<header><h1>⚡ SAKO Energy</h1><span class="pill" id="st">connecting…</span><button id="th" title="Theme">◐</button></header>
<main><section class="c wide" id="login" hidden></section>
<section class="c wide" id="flow"></section><section class="c" id="gb"></section><section class="c" id="gs"></section>
<section class="c" id="eb"></section><section class="c" id="ei"></section>
<section class="c wide" id="hg"></section><section class="c wide" id="en"></section></main>
<script>
const CFG={db:"https://sako-inverter-default-rtdb.asia-southeast1.firebasedatabase.app",key:"AIzaSyB4easAyWf_1RMzKm3DSxR97fcWaji6wuw"};
const $=i=>document.getElementById(i),ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let PW=Number(ls('panelW'))||325,CR=null,tok,exp=0,live=null,bms=null,hist=[],authP=null,range=24;try{CR=JSON.parse(ls('cr'))}catch(e){}
document.documentElement.dataset.theme=ls('theme')||'dark';
$('th').onclick=()=>{const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;ls('theme',t)};
async function f(u,o){try{return await fetch(u,o)}catch(e){throw new Error('Cannot reach '+new URL(u).host)}}
async function auth(){if(Date.now()<exp)return;if(!CR)throw new Error('LOGIN');
if(!authP)authP=(async()=>{try{const r=await f('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CFG.key,{method:'POST',body:JSON.stringify({email:CR.mail,password:CR.pw,returnSecureToken:true})});const j=await r.json();
if(!j.idToken){const m=(j.error&&j.error.message)||'Sign-in failed';if(/INVALID|EMAIL|PASSWORD|CREDENTIAL/.test(m)){CR=null;ls('cr',null)}throw new Error('LOGIN:Sign-in refused: '+m)}tok=j.idToken;exp=Date.now()+3e6}finally{authP=null}})();return authP}
async function get(p){await auth();const q=p.split('?');const r=await f(CFG.db+'/'+q[0]+'.json?'+(q[1]?q[1]+'&':'')+'auth='+tok);if(!r.ok)throw new Error('Database '+r.status);return r.json()}
const MODE={L:'Grid',B:'Battery',S:'Standby',P:'Power on',F:'Fault',H:'Saving'};
const fresh=(o,s)=>o&&Date.now()-o.ts<(s||90)*1000,hm=h=>Math.floor(h)+'h '+String(Math.round(h%1*60)).padStart(2,'0')+'m';
const E=(l,v,u)=>`<div class="e"><span>${l}</span><b>${v}${u?' <i>'+u+'</i>':''}</b></div>`;
function node(x,y,ic,val,lab,col,on,ly){return `<circle cx="${x}" cy="${y}" r="36" fill="none" stroke="${on?col:'var(--line)'}" stroke-width="3"/><text x="${x}" y="${y-6}" text-anchor="middle" font-size="20">${ic}</text><text x="${x}" y="${y+15}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${val}</text><text x="${x}" y="${ly}" text-anchor="middle" font-size="12" fill="var(--mute)">${lab}</text>`}
const line=(d,c,on,rev)=>`<path d="${d}" fill="none" stroke="${on?c:'var(--line)'}" stroke-width="3" class="fl${on?' on':''}${rev?' rev':''}"/>`;
function gauge(p,c,big,sub){return `<svg viewBox="0 0 200 116" class="gg"><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="${251.3*(1-Math.max(0,Math.min(1,p)))}"/><text x="100" y="88" text-anchor="middle" font-size="30" font-weight="600" fill="var(--ink)">${big}</text><text x="100" y="109" text-anchor="middle" font-size="11" fill="var(--mute)">${sub}</text></svg>`}
function setPW(){const v=Number(prompt('Solar panel size in watts',PW));if(v>=50){PW=v;ls('panelW',v);renderLive()}}
function renderLive(){const d=live;if(!d)return;const b=fresh(bms)?bms:null,soc=b?b.soc:d.soc,bw=b?b.power:(d.chgA-d.battDisA)*d.battV,chg=bw>0.5,dis=bw<-0.5,gon=d.gridV>100;
const sc=soc<20?'var(--bad)':soc<40?'#ffa000':'var(--bat)';let est='';if(b){if(b.curr<-.05)est='Empty in '+hm(b.remAh/-b.curr);else if(b.curr>.05)est='Full in '+hm((b.nomAh-b.remAh)/b.curr)}
$('flow').innerHTML=`<h3>Power flow</h3><svg viewBox="0 0 400 276" class="flowsvg">${line('M96,77 L170,118','var(--pv)',d.pvW>1)}${line('M304,77 L230,118','var(--grid)',gon)}${line('M96,193 L170,152','var(--bat)',chg||dis,chg)}${line('M230,152 L304,193','var(--load)',d.outW>0)}
<rect x="168" y="112" width="64" height="46" rx="10" fill="var(--card)" stroke="var(--pri)" stroke-width="3"/><text x="200" y="132" text-anchor="middle" font-size="16">⚙</text><text x="200" y="149" text-anchor="middle" font-size="11" fill="var(--ink)">${MODE[d.mode]||d.mode}</text>
${node(64,60,'☀',Math.round(d.pvW)+' W','Solar','var(--pv)',d.pvW>1,14)}${node(336,60,'🔌',d.gridV+' V','Grid','var(--grid)',gon,14)}${node(64,210,'🔋',Math.abs(Math.round(bw))+' W',(chg?'Charging ':dis?'Discharging ':'Battery ')+soc+'%','var(--bat)',chg||dis,268)}${node(336,210,'🏠',d.outW+' W','Load','var(--load)',d.outW>0,268)}</svg>`;
$('gb').innerHTML=`<h3>Battery</h3>${gauge(soc/100,sc,soc+'%',est||(b?b.volt.toFixed(2)+' V':d.battV+' V'))}`;
$('gs').innerHTML=`<h3>Solar</h3>${gauge(d.pvW/PW,'var(--pv)',Math.round(d.pvW)+' W',d.pvKwhToday+' kWh today')}<div class="small mute" onclick="setPW()">Panel ${PW} W · tap to change</div>`;
if(b){const mn=Math.min(...b.cells),mx=Math.max(...b.cells),t=b.temps&&b.temps.length?Math.max(...b.temps):'–';
$('eb').innerHTML='<h3>Battery (BMS)</h3>'+E('Voltage',b.volt.toFixed(2),'V')+E('Current',b.curr.toFixed(2),'A')+E('Power',Math.round(b.power),'W')+E('Capacity',b.remAh.toFixed(0)+' / '+b.nomAh.toFixed(0),'Ah')+E('Cycles',b.cycles)+E('Temperature',t,'°C')+E('Charge / discharge MOS',(b.chgFet?'ON':'OFF')+' / '+(b.disFet?'ON':'OFF'))+E('Cell difference',Math.round((mx-mn)*1000),'mV')
+b.cells.map((v,i)=>`<div class="e"><span>Cell ${i+1}</span><b style="width:55%;text-align:right">${v.toFixed(3)} <i>V</i><div class="bar"><i style="width:${Math.max(4,Math.min(100,(v-2.8)/.85*100))}%"></i></div></b></div>`).join('')}
else $('eb').innerHTML='<h3>Battery (BMS)</h3><p class="mute">BMS not reporting.</p>';
$('ei').innerHTML='<h3>Inverter</h3>'+E('Running on',MODE[d.mode]||d.mode)+E('Grid',d.gridV,'V · '+d.gridHz+' Hz')+E('Output',d.outV,'V · '+d.outHz+' Hz')+E('Apparent power',d.outVA,'VA')+E('Load',d.loadPct,'%')+E('PV input',d.pvV+' V · '+d.pvA+' A')+E('Bus voltage',d.busV,'V')+E('Charge / discharge',d.chgA+' / '+d.battDisA,'A')+E('Heatsink',d.tempC,'°C')}
function mini(a,k,lab,c,mx){if(a.length<2)return '<p class="mute">Collecting data…</p>';const m=mx||Math.max(10,...a.map(r=>r[k])),W=600,H=90,x=i=>i*W/(a.length-1),y=v=>H-4-v/m*(H-12);
const p=a.map((r,i)=>x(i).toFixed(1)+','+y(r[k]).toFixed(1)).join(' '),t=i=>new Date(a[i].ts).toLocaleString([],range>24?{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}:{hour:'2-digit',minute:'2-digit'});
return `<div class="mh"><span>${lab}</span><b>${Math.round(a[a.length-1][k])}</b></div><svg viewBox="0 0 600 ${H+14}" class="mini"><polygon points="0,${y(0)} ${p} ${W},${y(0)}" fill="${c}" opacity=".15"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="0" y="${H+11}" font-size="10" fill="var(--mute)">${t(0)}</text><text x="${W}" y="${H+11}" text-anchor="end" font-size="10" fill="var(--mute)">${t(a.length-1)}</text></svg>`}
function setRange(h){range=h;renderHist()}
function renderHist(){const a=hist.filter(r=>r.ts>=Date.now()-range*36e5);
$('hg').innerHTML='<h3>History</h3><div class="chips">'+[[6,'6 h'],[24,'24 h'],[168,'7 d']].map(([h,l])=>`<button class="chip${h==range?' on':''}" onclick="setRange(${h})">${l}</button>`).join('')+'</div>'+mini(a,'pvW','Solar (W)','var(--pv)')+mini(a,'outW','Load (W)','var(--load)')+mini(a,'soc','Battery (%)','var(--bat)',100)}
function renderEnergy(){const D={};for(let i=1;i<hist.length;i++){const r=hist[i],dt=Math.min(.17,(r.ts-hist[i-1].ts)/3.6e6);if(!(dt>0))continue;const k=new Date(r.ts).toDateString(),o=D[k]||(D[k]={t:r.ts,pv:0,ld:0});o.pv+=r.pvW*dt;o.ld+=r.outW*dt}
const ks=Object.keys(D).sort((a,b)=>D[a].t-D[b].t).slice(-7);if(!ks.length){$('en').innerHTML='<h3>Energy</h3><p class="mute">Collecting data…</p>';return}
const mx=Math.max(1,...ks.map(k=>Math.max(D[k].pv,D[k].ld)));
$('en').innerHTML='<h3>Energy (kWh per day)</h3><svg viewBox="0 0 350 150" style="width:100%">'+ks.map((k,i)=>{const x=i*50+6,hp=D[k].pv/mx*100,hl=D[k].ld/mx*100;
return `<rect x="${x}" y="${115-hp}" width="18" height="${hp}" rx="3" fill="var(--pv)"/><rect x="${x+20}" y="${115-hl}" width="18" height="${hl}" rx="3" fill="var(--load)"/><text x="${x+9}" y="${111-hp}" font-size="9" text-anchor="middle" fill="var(--mute)">${(D[k].pv/1000).toFixed(1)}</text><text x="${x+29}" y="${111-hl}" font-size="9" text-anchor="middle" fill="var(--mute)">${(D[k].ld/1000).toFixed(1)}</text><text x="${x+19}" y="132" font-size="10" text-anchor="middle" fill="var(--mute)">${new Date(D[k].t).toLocaleDateString([],{weekday:'short'})}</text>`}).join('')
+'</svg><div class="chips" style="margin-top:6px;font-size:13px"><span style="color:var(--pv)">■ Solar</span><span style="color:var(--load)">■ Load</span></div>'}
function showLogin(m){$('st').textContent='sign in';if($('lm')&&!m)return;$('login').hidden=false;
$('login').innerHTML=`<h3>Sign in</h3><p class="mute">Use your Firebase email and password. Stored on this device only.</p>${m?'<p style="color:var(--bad)">'+m+'</p>':''}<input id="lm" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="doLogin()">Sign in</button>`}
function doLogin(){CR={mail:$('lm').value.trim(),pw:$('lp').value};ls('cr',JSON.stringify(CR));exp=0;tick();loadHist()}
async function tick(){if(!CR){showLogin();return}try{live=await get('inverter/live');if(!live)throw new Error('No data yet');$('login').hidden=true;$('login').innerHTML='';try{bms=await get('bms/live')}catch(e){bms=null}renderLive()}
catch(e){if(e.message.startsWith('LOGIN')){showLogin(e.message.slice(6));return}$('st').textContent=e.message;$('st').className='pill'}}
async function loadHist(){try{const h=await get('inverter/history?orderBy=%22$key%22&limitToLast=2100');hist=h?Object.values(h):[];renderHist();renderEnergy()}catch(e){}}
setInterval(()=>{if(!live)return;const s=Math.round((Date.now()-live.ts)/1000);$('st').textContent=s<60?'● live · '+s+'s':'offline '+Math.round(s/60)+' min'},1000);
tick();loadHist();setInterval(tick,6000);setInterval(loadHist,9e5);
</script></body></html>
